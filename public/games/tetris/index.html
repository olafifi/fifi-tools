<!doctype html>
<html lang="zh-CN" data-game-id="tetris">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>俄罗斯方块</title>
    <link rel="stylesheet" href="../shared/game-shell.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="tetris-shell" data-game-state="running">
      <div class="score-line"><span>俄罗斯方块</span><strong>分数 <b data-score="0">0</b></strong></div>
      <canvas width="240" height="480" aria-label="俄罗斯方块游戏区"></canvas>
      <div class="touch-controls" data-touch-control aria-label="触摸控制">
        <button type="button" data-action="left" aria-label="向左">←</button>
        <button type="button" data-action="rotate" aria-label="旋转">↻</button>
        <button type="button" data-action="right" aria-label="向右">→</button>
        <button type="button" data-action="down" aria-label="加速下落">↓</button>
      </div>
      <p>方向键移动，↑ 旋转，空格直接落下。</p>
    </main>
    <script src="../shared/bridge.js"></script>
    <script src="game.js"></script>
  </body>
</html>
