<!doctype html>
<html lang="zh-CN" data-game-id="merge-danbai">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>合成大蛋白</title>
    <link rel="stylesheet" href="../shared/game-shell.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="merge-shell">
      <section class="merge-game">
        <div class="merge-head">
          <div><span>合成大蛋白</span><strong>分数 <b data-score>0</b></strong></div>
          <div class="next" data-next-danbai><small>下一个</small><img alt="下一个蛋白" /></div>
        </div>
        <div class="merge-stage" data-merge-stage tabindex="-1">
          <div class="loss-line"><span>危险线</span></div>
          <div class="drop-guide" data-drop-guide aria-hidden="true"></div>
          <div class="aim-bubble" data-aim-bubble>
            <img class="aim-piece" data-aim-piece alt="准备投放的蛋白" />
          </div>
          <div class="game-over" data-game-over hidden>
            <div class="game-over__card">
              <img src="../../danbai/eye-roll.png" alt="游戏结束蛋白" />
              <h2>本局结束</h2>
              <p>最终得分 <strong data-final-score>0</strong></p>
              <form data-qualifying-form hidden>
                <p>🎉 进入全站前 10 名，请留下名字</p>
                <label>
                  <span class="sr-only">上榜名字</span>
                  <input data-nickname autocomplete="nickname" placeholder="输入 1–12 个字符" />
                </label>
                <button type="submit" data-submit-score>提交并上榜</button>
                <div data-submit-status aria-live="polite"></div>
              </form>
              <button type="button" data-local-restart>不提交，直接再来一局</button>
            </div>
          </div>
        </div>
        <p data-status aria-live="polite">移动蛋白，点击或轻触投放。两个相同蛋白会合成。</p>
      </section>
      <button class="leaderboard-open" type="button" data-open-leaderboard>排行榜</button>
      <aside class="leaderboard" data-leaderboard aria-labelledby="leaderboard-title">
        <button class="leaderboard-close" type="button" data-close-leaderboard aria-label="关闭排行榜">×</button>
        <h2 id="leaderboard-title">🏆 全站最高分</h2>
        <p>同名只保留最高分 · 前 10 名</p>
        <div data-leaderboard-status>排行榜加载中…</div>
        <button class="leaderboard-retry" type="button" data-retry-leaderboard hidden>重试排行榜</button>
        <ol data-leaderboard-list></ol>
      </aside>
    </main>
    <script src="../shared/bridge.js"></script>
    <script src="vendor/matter.min.js"></script>
    <script type="module" src="game.js"></script>
  </body>
</html>
