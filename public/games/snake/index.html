<!doctype html>
<html lang="zh-CN" data-game-id="snake">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>贪吃蛇</title>
    <link rel="stylesheet" href="../shared/game-shell.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="snake-shell" data-direction="right" tabindex="-1">
      <div class="score-line"><span>贪吃蛇</span><strong>吃到 <b data-score>0</b> 只蛋白</strong></div>
      <canvas data-snake-board width="400" height="400" aria-label="贪吃蛇游戏区"></canvas>
      <div class="snake-controls" data-touch-control aria-label="方向控制">
        <button type="button" data-direction-button="up" aria-label="向上">↑</button>
        <button type="button" data-direction-button="left" aria-label="向左">←</button>
        <button type="button" data-direction-button="down" aria-label="向下">↓</button>
        <button type="button" data-direction-button="right" aria-label="向右">→</button>
      </div>
      <p data-status aria-live="polite">用方向键或下方按钮开始巡逻。</p>
    </main>
    <script src="../shared/bridge.js"></script>
    <script src="snake.js"></script>
  </body>
</html>
