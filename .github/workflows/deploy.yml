name: Deploy Fifi tools to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_LEADERBOARD_API_BASE: ${{ vars.LEADERBOARD_API_BASE }}
      FRONTEND_ORIGIN: https://olafifi.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate leaderboard API
        run: |
          node -e "const value = process.env.VITE_LEADERBOARD_API_BASE; if (!value) throw new Error('Repository variable LEADERBOARD_API_BASE is required.'); const url = new URL(value); if (url.protocol !== 'https:' || url.origin !== value.replace(/\/$/, '')) throw new Error('LEADERBOARD_API_BASE must be an HTTPS origin without a path.');"
          node -e "(async () => { const apiBase = process.env.VITE_LEADERBOARD_API_BASE.replace(/\/$/, ''); const origin = process.env.FRONTEND_ORIGIN; const response = await fetch(apiBase + '/healthz', { headers: { Origin: origin }, signal: AbortSignal.timeout(10000) }); if (!response.ok) throw new Error('Leaderboard health check failed with HTTP ' + response.status); if (response.headers.get('access-control-allow-origin') !== origin) throw new Error('Leaderboard CORS does not allow the production frontend origin.'); })().catch((error) => { console.error(error); process.exit(1); });"
      - run: npm ci
      - run: npm ci --prefix server/leaderboard
      - run: npm test --prefix server/leaderboard
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:games
      - run: npm run e2e
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
