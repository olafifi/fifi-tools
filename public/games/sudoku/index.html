<!doctype html>
<html lang="zh-CN" data-game-id="sudoku">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>数独</title>
    <link rel="stylesheet" href="../shared/game-shell.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="sudoku-shell">
      <div class="game-head">
        <div><span>MEDIUM</span><h1>数独</h1></div>
        <button type="button" data-new-game>换一题</button>
      </div>
      <p class="hint">每行、每列和每个九宫格都填入 1—9。</p>
      <div class="sudoku-grid" role="grid" aria-label="数独棋盘"></div>
      <p class="status" aria-live="polite" data-status>慢慢来，不着急。</p>
    </main>
    <script src="../shared/bridge.js"></script>
    <script src="sudoku.js"></script>
    <script src="game.js"></script>
  </body>
</html>
